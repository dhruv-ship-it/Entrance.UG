services:
  postgres:
    image: postgres:16-alpine
    container_name: entrance-ug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: entrance_ug
      POSTGRES_USER: entrance_ug
      POSTGRES_PASSWORD: entrance_ug_local_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrance_ug -d entrance_ug"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: entrance-ug-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
